# \~/.config/hypr/hyprlock.conf

$font   = JetBrainsMono Nerd Font
$accent = rgba(137, 180, 250, 1.0)   # #89b4fa
$text   = rgba(205, 214, 244, 1.0)   # #cdd6f4
$muted  = rgba(108, 112, 134, 1.0)   # #6c7086
$bgsoft = rgba(30, 30, 46, 0.70)     # #1e1e2e

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = outCubic, 0.16, 1, 0.3, 1
    bezier = inCubic, 0.7, 0, 0.84, 0
    animation = fadeIn, 1, 4, outCubic
    animation = fadeOut, 1, 3, inCubic
    animation = inputFieldDots, 1, 2, outCubic
    animation = inputFieldColors, 1, 2, outCubic
}

background {
    monitor =
    blur_size = 7
    brightness = 0.72
    contrast = 0.9
}

# время
label {
    text = $TIME
    color = $text
    font_size = 90
    font_family = $font
    position = 0, 140
    halign = center
    valign = center
}

label {
    text = cmd[update:60000] date +"%A, %d %B"
    color = $muted
    font_size = 16
    font_family = $font
    position = 0, 75
    halign = center
    valign = center
}

label {
    text = 󰌾  $USER
    color = $text
    font_size = 18
    font_family = $font
    position = 0, 30
    halign = center
    valign = center
}

# пароль
input-field {
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1
    outer_color = $accent
    inner_color = $bgsoft
    font_color = $text
    fade_on_empty = false
    rounding = 18
    placeholder_text = <span foreground="##6c7086">password</span>
    fail_text = <span foreground="##f38ba8">$FAIL</span>
    check_color = $accent
    fail_color = rgba(243, 139, 168, 1.0)
    position = 0, -40
    halign = center
    valign = center
}

# карточка info
shape {
    size = 320, 230
    color = $bgsoft
    rounding = 20
    border_size = 2
    border_color = $accent
    position = 0, -220
    halign = center
    valign = center
    zindex = 1
}

# иконка дистра (упрощённо)
label {
    monitor =
    text = <span size="32000"> 󰣇 </span>
    color = $accent
    font_size = 20
    font_family = Symbols Nerd Font
    position = -5, -145
    halign = center
    valign = center
    zindex = 3
}

# OS
label {
    monitor =
    text = cmd[update:30000] grep PRETTY_NAME /etc/os-release | cut -d= -f2 | tr -d '"'
    color = rgba(205, 214, 244, 1.0)
    font_size = 16
    font_family = monospace
    position = 0, -175
    halign = center
    valign = center
}

# Kernel
label {
    monitor =
    text = cmd[update:30000] uname -r
    color = rgba(205, 2
    font_size = 14
    font_family = monospace
    position = 0, -200
    halign = center
    valign = center
}

# Host
label {
    monitor =
    text = cmd[update:30000] uname -n
    color = $text
    font_size = 14
    font_family = monospace
    position = 0, -225
    halign = center
    valign = center
}

# Uptime
label {
    monitor =
    text = cmd[update:5000] uptime -p | sed 's/up //'
    color = $text
    font_size = 14
    font_family = monospace
    position = 0, -250
    halign = center
    valign = center
}

# Memory
label {
    monitor =
    text = cmd[update:5000] free -h | awk '/Mem:/{print $3"/"$2}'
    color = $text
    font_size = 14
    font_family = monospace
    position = 0, -275
    halign = center
    valign = center
}
